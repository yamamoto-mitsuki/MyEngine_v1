# =============================================================================
# ReleaseBuild.yml
# GitHub に push したら、GitHub のクラウド（Windows）でエンジンを Release でビルドして、通るか確かめる（GitHub Actions）
# 結果は GitHub のリポジトリの「Actions」タブで見られる
# =============================================================================
name: ReleaseBuild

# ===== いつ動かすか =====
on:
  push:              # どのブランチでも、push したとき
  pull_request:      # プルリクエストを作った・更新したとき
  workflow_dispatch: # Actions タブの「Run workflow」ボタンで、手で動かすとき

# ===== 共通の値 =====
env:
  SOLUTION_FILE_PATH: project\MyEngine_v1.sln # ビルドするソリューション（リポジトリのルートから見た場所）
  CONFIGURATION: Release                      # 構成

# ===== やること =====
jobs:
  build:
    # Visual Studio 2026（v145 のツールセット）が入っている Windows を借りる
    runs-on: windows-2025-vs2026

    steps:
      # --- リポジトリを取ってくる ---
      - name: Checkout
        uses: actions/checkout@v6

      # --- ビルド ---
      - name: Build
        shell: pwsh
        run: |
          # MSBuild の場所を探す（vswhere は Visual Studio と一緒に入っている、Visual Studio を探すツール）
          # vswhere は VS のインストーラーの中にある。インストーラーは 32 ビットのアプリなので「Program Files (x86)」に入る
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          # ソリューションをビルドする（/m は CPU を全部使う。失敗したら、ここでジョブも失敗にする）
          & $msbuild $env:SOLUTION_FILE_PATH /m /nologo /verbosity:minimal /p:Configuration=$env:CONFIGURATION /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
