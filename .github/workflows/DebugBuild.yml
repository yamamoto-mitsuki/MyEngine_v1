# =============================================================================
# DebugBuild.yml
# GitHubにpushしたら、GitHubのクラウドでエンジンをビルドし、通るか確認（GitHub Actions）
# 結果はGitHub のActionsタブで見れる
# =============================================================================
name: DebugBuild

# ===== いつ動かすか =====
on:
  push:              # どのブランチでもpushしたとき
  pull_request:      # プルリクエストを作った・更新したとき
  workflow_dispatch: # ActionタブのRun workflowボタンで、手で動かすとき

# ===== 共通の値 =====
env:
  SOLUTION_FILE_PATH: project\MyEngine_v1.sln # ビルドするソリューション（リポジトリのルートから見た場所）
  CONFIGURATION: Debug                        # 構成（sln の対応付けで、エンジンの Development がビルドされる）

# ===== やること =====
jobs:
  build:
    # Visual Stdio 2026（v145のツールセット）が入っているWindowsを借りる
    runs-on: windows-2025-vs2026
    
    steps:
      # --- リポジトリを取ってくる ---
      - name: Checkout
        uses: actions/checkout@v6
      # --- vcpkgのlibを前回から使いまわす（無いと毎回assimpのビルドに数分かかる）---
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('project/externals/vcpkg.json', 'project/externals/vcpkg-configuration.json') }}
        
      # --- ビルド ---
      - name: Build
        shell: pwsh
        run: |
          # MSBuildの場所を探す（vswhereはVisual Studioと一緒に入っているVisual Stdioを探すツール）
          # vswhere は VS のインストーラーの中にある。インストーラーは 32 ビットのアプリなので「Program Files (x86)」に入る
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          # ソリューションをビルドする（/mはCPUを全部使う。失敗したら、ここでジョブも失敗にする）
          & $msbuild $env:SOLUTION_FILE_PATH /m /nologo /verbosity:minimal /p:Configuration=$env:CONFIGURATION /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      









    
  

  
